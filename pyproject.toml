[project]
name = "tracewell-agent"
version = "0.1.0"
description = "Instrumentation agent for TraceWell"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracewell_agent*"]